# Ablation: self_model disabled. Loop runs with an empty self-model snapshot.
db_path: ./data/acl_ablation_selfmodel.sqlite3
provider: mock
provider_model: ""
provider_params:
  timeout_s: 30
workspace_capacity: 7
budgets:
  max_steps: 20
  max_tokens: 8000
  max_wall_time_s: 120.0
  max_tool_calls: 10
autonomous_enabled: true
approval_required_default: false
log_level: INFO
seed: 0
results_dir: experiments/results
components:
  memory: true
  self_model: false
  workspace: true
  metacognition: true
  attention: true
  learning: true
