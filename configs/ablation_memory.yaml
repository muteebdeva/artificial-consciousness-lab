# Ablation: memory disabled. Loop must skip recall; no persistent stores.
db_path: ./data/acl_ablation_memory.sqlite3
provider: mock
provider_model: ""
provider_params:
  timeout_s: 30
workspace_capacity: 7
budgets:
  max_steps: 20
  max_tokens: 8000
  max_wall_time_s: 120.0
  max_tool_calls: 10
autonomous_enabled: true
approval_required_default: false
log_level: INFO
seed: 0
results_dir: experiments/results
components:
  memory: false
  self_model: true
  workspace: true
  metacognition: true
  attention: true
  learning: true
