[project]
name = "artificial-consciousness-lab"
version = "0.1.0"
description = "Research-grade platform investigating machine consciousness: integrated cognition, persistent self-modeling, metacognition, attention, memory, and autonomous cognitive processes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "artificial-consciousness-lab contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
