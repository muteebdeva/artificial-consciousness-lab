<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1028" viewBox="0 0 1200 1028" role="img" aria-labelledby="archTitle archDesc">
<title id="archTitle">Cognitive loop architecture</title>
<desc id="archDesc">The 15-stage cognitive cycle: perception, candidate assembly, attention, workspace selection, broadcast, contradiction detection, confidence estimation, planning, approval gate, execution, prediction recording, self-model update, learning, audit, and cycle result. Side panels show SQLite persistence, safety controls, and the provider abstraction.</desc>
